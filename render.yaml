services:
  - type: web
    name: smeta-parser
    runtime: node
    plan: free
    branch: claude/build-estimate-parser-6wZHx
    buildCommand: npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false # вводится вручную в дашборде Render
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-20250514
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 50mb
